  </text>

  <!-- Accent Divider -->
  <rect x="96" y="318" width="420" height="5" rx="2.5" fill="url(#accentGrad)" />

  <!-- Hebrew Subtitle -->
  <text x="1104" y="388" text-anchor="end" direction="rtl" fill="#e2e8f0" font-family="'Rubik', system-ui, -apple-system, Arial, sans-serif" font-size="34" font-weight="600">
