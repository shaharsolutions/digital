<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>הסכם קבלת אורחים | פנסיון משפחתי זמיר</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      --ink: #172e25;
      --muted: #4e6259;
      --brand: #204c3b;
      --brand-hover: #173d2e;
      --line: #d2dfd8;
      --paper: #fff;
      --tint: #edf4ee;
      --danger: #8c231b;
      background: #f4f7f4;
      color: var(--ink);
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    p { line-height: 1.6; text-wrap: pretty; }
    h1, h2 { margin: 0; text-wrap: balance; }
    main { width: min(100% - 36px, 740px); margin: 34px auto 48px; }
    .hero { padding: 28px 32px; border-radius: 20px; background: var(--brand); color: #fff; }
    .hero p { margin: 0; color: #e0ede5; }
    .hero h1 { margin: 10px 0 7px; font-size: clamp(1.75rem, 5vw, 2.45rem); }
    .trial { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: baseline; margin: 14px 0 20px; padding: 12px 16px; border: 1px solid #e3d5aa; border-radius: 12px; color: #594618; background: #fffbec; font-size: .9rem; line-height: 1.5; }
    .progress-label { display: flex; justify-content: flex-end; color: var(--muted); font-size: .9rem; margin-block-end: 8px; }
    .counter { flex: none; font-variant-numeric: tabular-nums; }
    progress { width: 100%; height: 6px; border: 0; display: block; appearance: none; background: #dbe6dd; border-radius: 6px; overflow: hidden; color: var(--brand); margin-block-end: 15px; }
    progress::-webkit-progress-bar { background: #dbe6dd; }
    progress::-webkit-progress-value { background: var(--brand); border-radius: 6px; }
    progress::-moz-progress-bar { background: var(--brand); border-radius: 6px; }
    .card { padding: 24px 30px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; }
    .card h2 { font-size: clamp(1.25rem, 4vw, 1.5rem); }
    .card h2:focus { outline: 0; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 18px; margin-block-start: 22px; }
    fieldset { border: 0; padding: 0; min-width: 0; margin: 0; }
    .wide { grid-column: 1 / -1; }
    label, legend { font-weight: 700; line-height: 1.4; }
    .fields > :not(.wide) > label { display: block; }
    .required { color: var(--danger); margin-inline-start: .2rem; }
    .help, .intro { color: var(--muted); font-size: .9rem; margin: 5px 0 7px; }
    .fields > :not(.wide) > .help { margin-block-end: 0; }
    .control { width: 100%; min-height: 46px; display: block; margin-block-start: 7px; padding: 9px 11px; border: 1px solid #aabeb2; color: var(--ink); background: #fff; border-radius: 9px; font: inherit; }
    .control[dir=ltr] { text-align: start; }
    textarea.control { min-height: 92px; resize: vertical; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 9px; }
    .choice { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; font-weight: 500; }
    .choice:has(input:checked) { border-color: var(--brand); background: var(--tint); }
    .choice input { width: 18px; height: 18px; accent-color: var(--brand); margin: 0; flex: none; }
    .terms { white-space: pre-line; background: var(--tint); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); padding: 15px 16px; }
    .file-box { padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: #f7faf7; }
    .upload-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-block-start: 10px; }
    .upload-picker { position: relative; display: grid; place-items: center; min-width: 148px; min-height: 44px; padding: 8px 13px; border: 1px solid #aabeb2; border-radius: 8px; color: var(--brand); background: #fff; font-weight: 700; }
    .upload-picker:focus-within { outline: 3px solid #639777; outline-offset: 2px; }
    .upload-picker:hover { background: var(--tint); }
    .upload-picker input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .upload-picker input::file-selector-button { width: 100%; height: 100%; cursor: pointer; }
    .upload-actions button { min-height: 44px; }
    .file-box output { display: block; overflow-wrap: anywhere; font-size: .9rem; margin-block-start: 8px; }
    .file-box output:empty { display: none; }
    .actions { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-block-start: 17px; }
    .hero + form { margin-block-start: 22px; }
    button { min-height: 46px; border: 1px solid transparent; border-radius: 9px; padding: 9px 17px; font: 700 1rem Arial, system-ui, sans-serif; cursor: pointer; transition: background-color 110ms ease-out, scale 110ms ease-out; }
    button:active:not(:disabled) { scale: .96; }
    button:disabled { cursor: progress; opacity: .68; }
    .primary { color: #fff; background: var(--brand); min-width: 130px; }
    .primary:hover:not(:disabled) { background: var(--brand-hover); }
    .secondary { background: #fff; color: var(--brand); border-color: var(--line); }
    .secondary:hover:not(:disabled) { background: var(--tint); }
    .status { margin: 10px 0 0; color: var(--danger); font-weight: 700; }
    .status:empty { display: none; }
    .success p { margin-block-end: 0; }
    :focus-visible { outline: 3px solid #639777; outline-offset: 2px; }
    @media (max-width: 565px) {
      main { width: calc(100% - 24px); margin: 14px auto 30px; }
      .hero, .card { padding: 19px 17px; border-radius: 15px; }
      .fields { grid-template-columns: 1fr; gap: 17px; }
      .trial { margin-block-end: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p>פנסיון משפחתי זמיר · חוף דדו, חיפה</p>
      <h1>הסכם קבלת אורחים</h1>
      <p>מלאו טופס אחד לכל אורח/ת. קראו את תנאי ההסכם בסוף הטופס.</p>
    </header>
    <p class="trial" id="trial-message" hidden><strong>גרסת ניסיון</strong><span>הזינו פרטי דוגמה וצרפו תמונת דוגמה בלבד.</span></p>
    <form id="agreement" novalidate>
      <input type="hidden" name="trial">
      <input type="hidden" name="requestId">
      <div class="progress-label"><span class="counter" id="step-counter" role="status"></span></div>
      <progress id="progress" aria-label="התקדמות במילוי הטופס"></progress>
      <div id="steps"></div>
      <p id="status" class="status" role="alert"></p>
      <div class="actions">
        <button type="button" class="secondary" id="previous" hidden>חזרה</button>
        <button type="button" class="primary" id="next">המשך</button>
        <button type="submit" class="primary" id="send" hidden>שליחת הסכם</button>
      </div>
    </form>
    <section id="success" class="card success" hidden>
      <h2 tabindex="-1">ההסכם התקבל</h2>
      <p id="receipt"></p>
      <div class="actions"><button type="button" class="secondary" id="again">מילוי טופס נוסף</button></div>
    </section>
  </main>
  <script>
    const configuration = {"items":[["header","פרטי האורח/ת",false,"",null,"question-0"],["text","שם האורח/ת",true,"",null,"question-1"],["text","סוג וגזע",true,"לדוגמה: כלב מעורב או חתול סיאמי.",null,"question-2"],["text","גיל",true,"ציינו גם אם הגיל בחודשים או בשנים.",null,"question-3"],["choice","עיקור או סירוס",true,"",["כן","לא","לא ידוע"],"question-4"],["paragraph","מזון והנחיות האכלה",true,"ציינו סוג מזון, כמות ושעות האכלה.",null,"question-5"],["section","וטרינר וחיסונים",false,"",null,"question-6"],["text","שם הווטרינר או המרפאה",true,"",null,"question-7"],["text","טלפון הווטרינר",false,"",null,"question-8"],["text","כתובת המרפאה",false,"",null,"question-9"],["text","טלפון וטרינר לחירום",false,"",null,"question-10"],["paragraph","פרטים מיוחדים",false,"למשל תרופות, רגישויות או הנחיות טיפול.",null,"question-11"],["paragraph","פרטי חיסונים",true,"פרטו את החיסונים הידועים, כולל שעלת מכלאות אם רלוונטי. נא להציג פנקס חיסונים עם ההגעה.",null,"question-12"],["photo","צילום פנקס חיסונים",false,"רשות. צרפו תמונה אחת ברורה, בגודל של עד 10 MB. אפשר לבחור JPG, PNG, WebP או HEIC.",null,"photo"],["section","פרטי הבעלים",false,"",null,"question-13"],["text","שם מלא של הבעלים",true,"",null,"question-14"],["phone","טלפון נייד",true,"",null,"question-15"],["text","טלפון נוסף של הבעלים",false,"",null,"question-16"],["email","דוא״ל",false,"",null,"question-17"],["text","כתובת מגורים",true,"",null,"question-18"],["text","טלפון של איש קשר נוסף",false,"",null,"question-19"],["section","פרטי השהות ושירותים נוספים",false,"יום לתשלום מתחלף בכל יום בשעה 12:00.",null,"question-20"],["date","תאריך הגעה",true,"",null,"question-21"],["time","שעת הגעה",false,"",null,"question-22"],["date","תאריך עזיבה",true,"",null,"question-23"],["time","שעת עזיבה",false,"",null,"question-24"],["paragraph","תאריכים נוספים",false,"",null,"question-25"],["amount","תעריף יומי בש״ח",false,"אם כבר סוכם מול הפנסיון.",null,"question-26"],["checkbox","שירותים נוספים",false,"אפשר לסמן כמה שירותים.",["איסוף מהבית","החזרה לבית","תספורת או ציפורניים","מזון","טיפול להדברה","שונות"],"question-27"],["paragraph","פירוט שירותים נוספים",false,"",null,"question-28"],["amount","סה״כ לתשלום בש״ח",false,"אם כבר סוכם מול הפנסיון.",null,"question-29"],["section","הצהרת פנסיון משפחתי זמיר ובעל/י הכלב/ה",false,"פנסיון משפחתי זמיר מתחייב לתת את הטיפול המסור, המקצועי והאמין ביותר לאורחיו.\n\nפנסיון משפחתי זמיר פועל כפנסיון פתוח ללא כלובים וללא הפרדה בין הכלבים ומספק שרות של שני טיולים ביום (עם רצועה) לכל כלב בטיילת דדו.\n\nפנסיון משפחתי זמיר אינו נושא באחריות במקרה של פציעה, מחלה או אובדן של אורחיו הכלבים בזמן שהותם בפנסיון. בעל הכלב/ה מוותר בזאת על זכות כל תביעה משפטית בגין כל טוענה כנגד פנסיון משפחתי זמיר. כלב שאינו מחוסן נגד \"שעלת מכלאות\" נמצא בסיכון שלא באחריות פנסיון משפחתי זמיר.",null,"question-30"],["text","שם מלא לאישור ההסכם",true,"הקלידו את שמכם המלא במקום חתימה ידנית.",null,"question-31"],["checkbox","אישור תנאי ההסכם",true,"",["קראתי את תנאי ההסכם ואני מסכים/ה להם."],"question-32"]],"key":"","trial":false,"maxPhotoBytes":10485760,"submitUrl":"https://script.google.com/macros/s/AKfycbzBGmoRP_Ftlj7cH2lr1bn9dDF_z7nfJ0YfiIsaVZCBJkdHhuOFwt-8xh5LYk6qFsN-hw/exec?route=intake"};
    const form = document.getElementById('agreement');
    const stepsRoot = document.getElementById('steps');
    const statusText = document.getElementById('status');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const send = document.getElementById('send');
    const success = document.getElementById('success');
    const steps = [];
    let active = 0;
    let sending = false;

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function markRequired(label, required) {
      if (!required) return;
      const mark = element('span', '*', 'required');
      mark.setAttribute('aria-hidden', 'true');
      label.append(mark);
    }

    function makeStep(title, help) {
      const step = element('section', '', 'card');
      const heading = element('h2', title);
      heading.tabIndex = -1;
      heading.id = 'step-' + steps.length;
      step.setAttribute('aria-labelledby', heading.id);
      step.append(heading);
      if (help) step.append(element('p', help, title.startsWith('הצהרת') ? 'terms' : 'intro'));
      const fields = element('div', '', 'fields');
      step.append(fields);
      stepsRoot.append(step);
      steps.push({step, heading, fields});
    }

    function makeField([type, title, required, help, choices, name]) {
      const isChoice = type === 'choice' || type === 'checkbox';
      const field = element(isChoice ? 'fieldset' : 'div');
      field.dataset.field = name;
      const label = element(isChoice ? 'legend' : 'label', title);
      if (!isChoice) label.htmlFor = name;
      markRequired(label, required);
      field.append(label);
      const helpText = help ? element('p', help, 'help') : null;
      if (helpText) {
        helpText.id = name + '-help';
        field.append(helpText);
      }

      if (isChoice) {
        field.classList.add('wide');
        const buttons = element('div', '', 'choices');
        choices.forEach((choice, index) => {
          const option = element('label', '', 'choice');
          const control = element('input');
          control.type = type === 'choice' ? 'radio' : 'checkbox';
          control.name = type === 'choice' ? name : name + '-' + index;
          control.value = type === 'choice' ? choice : 'yes';
          control.required = required;
          option.append(control, element('span', choice));
          buttons.append(option);
        });
        if (help) field.setAttribute('aria-describedby', name + '-help');
        field.append(buttons);
        return field;
      }

      const control = element(type === 'paragraph' ? 'textarea' : 'input');
      control.name = name;
      control.id = name;
      control.required = required;
      if (help) control.setAttribute('aria-describedby', name + '-help');
      if (type === 'photo') {
        field.classList.add('wide', 'file-box');
        control.type = 'file';
        control.accept = 'image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif';
        const actions = element('div', '', 'upload-actions');
        const picker = element('div', '', 'upload-picker');
        const caption = element('span', 'בחירת תמונה');
        caption.setAttribute('aria-hidden', 'true');
        picker.append(caption, control);
        const remove = element('button', 'הסרת התמונה', 'secondary');
        remove.type = 'button';
        remove.hidden = true;
        actions.append(picker, remove);
        const fileStatus = element('output');
        fileStatus.setAttribute('for', name);
        fileStatus.setAttribute('aria-live', 'polite');
        const showPhoto = () => {
          const file = control.files[0];
          const tooLarge = file && file.size > configuration.maxPhotoBytes;
          control.setCustomValidity(tooLarge ? 'אפשר לצרף תמונה בגודל של עד 10 MB.' : '');
          fileStatus.textContent = tooLarge ? 'התמונה גדולה מדי. בחרו תמונה קטנה יותר.' : (file ? file.name : '');
          remove.hidden = !file;
          caption.textContent = file ? 'החלפת תמונה' : 'בחירת תמונה';
        };
        control.addEventListener('change', showPhoto);
        remove.addEventListener('click', () => { control.value = ''; showPhoto(); control.focus(); });
        field.append(actions, fileStatus);
        return field;
      }

      control.className = 'control';
      if (type === 'paragraph') {
        field.classList.add('wide');
        control.maxLength = 1800;
      } else {
        const phone = type === 'phone' || title.startsWith('טלפון');
        control.type = phone ? 'tel' : ({email: 'email', date: 'date', time: 'time', amount: 'number'})[type] || 'text';
        control.maxLength = phone ? 24 : 240;
        if (type === 'phone') control.pattern = '[+()0-9 .\\-]{7,24}';
        if (type === 'amount') {
          control.min = '0';
          control.max = '9999999999.99';
          control.step = '0.01';
          control.inputMode = 'decimal';
        }
        if (phone || ['email', 'date', 'time', 'amount'].includes(type)) control.dir = 'ltr';
        if (type === 'email') control.autocomplete = 'email';
        if (type === 'phone') control.autocomplete = 'tel';
        if (title === 'שם מלא של הבעלים') control.autocomplete = 'name';
        if (title === 'כתובת מגורים') control.autocomplete = 'street-address';
      }
      field.insertBefore(control, type === 'paragraph' ? null : helpText);
      return field;
    }

    function newRequest() {
      form.elements.trial.value = configuration.key;
      form.elements.requestId.value = crypto.randomUUID();
    }

    function showStep(index, focus = true) {
      active = index;
      steps.forEach(({step}, stepIndex) => { step.hidden = stepIndex !== index; });
      document.getElementById('step-counter').textContent = `שלב ${index + 1} מתוך ${steps.length}`;
      const progress = document.getElementById('progress');
      progress.max = steps.length;
      progress.value = index + 1;
      previous.hidden = index === 0;
      next.hidden = index === steps.length - 1;
      send.hidden = !next.hidden;
      if (focus) {
        steps[index].heading.focus({preventScroll: true});
        steps[index].step.scrollIntoView({block: 'start'});
      }
    }

    function validateStep(index) {
      const invalid = [...steps[index].fields.querySelectorAll('input, textarea')].find(control => !control.validity.valid);
      if (!invalid) return true;
      if (index !== active) showStep(index);
      invalid.reportValidity();
      return false;
    }

    function advance() {
      statusText.textContent = '';
      if (validateStep(active)) showStep(active + 1);
    }

    function setSending(inProgress) {
      sending = inProgress;
      send.disabled = inProgress;
      previous.disabled = inProgress;
      send.textContent = inProgress ? 'שולח…' : 'שליחת הסכם';
      form.setAttribute('aria-busy', String(inProgress));
    }

    function showResult(result) {
      setSending(false);
      if (!result?.ok) {
        const field = [...form.querySelectorAll('[data-field]')].find(node => node.dataset.field === result?.field);
        if (field) {
          const index = steps.findIndex(({step}) => step.contains(field));
          showStep(index);
          field.querySelector('input, textarea')?.focus();
        }
        statusText.textContent = result?.error || 'השליחה לא הושלמה. אפשר לנסות שוב.';
        return;
      }
      const receipt = document.getElementById('receipt');
      receipt.replaceChildren(document.createTextNode(configuration.trial ? 'מספר בדיקה ' : 'מספר אסמכתה '));
      receipt.append(element('bdi', result.reference));
      if (result.photoSaved) receipt.append(document.createTextNode(' · הצילום נשמר'));
      if (configuration.trial) receipt.append(document.createTextNode(result.mailSent ? ' · מייל הבדיקה נשלח' : ' · מייל הבדיקה ממתין לשליחה'));
      form.hidden = true;
      success.hidden = false;
      success.querySelector('h2').focus();
      success.scrollIntoView({block: 'start'});
    }

    function encodePhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(reader.result.split(',', 2)[1]));
        reader.addEventListener('error', () => reject(reader.error));
        reader.readAsDataURL(file);
      });
    }

    async function sendFromWebsite() {
      const data = Object.fromEntries(new FormData(form));
      data.photo = data.photo.size ? await encodePhoto(data.photo) : '';
      const response = await fetch(configuration.submitUrl, {
        method: 'POST',
        credentials: 'omit',
        body: JSON.stringify(data),
      });
      if (!response.ok) throw new Error('Submission failed');
      return response.json();
    }

    document.getElementById('trial-message').hidden = !configuration.trial;
    for (const item of configuration.items) {
      if (item[0] === 'header' || item[0] === 'section') makeStep(item[1], item[3]);
      else steps.at(-1).fields.append(makeField(item));
    }
    newRequest();
    showStep(0, false);

    next.addEventListener('click', advance);
    previous.addEventListener('click', () => { statusText.textContent = ''; showStep(active - 1); });
    document.getElementById('again').addEventListener('click', () => {
      form.reset();
      form.elements.photo.dispatchEvent(new Event('change'));
      newRequest();
      success.hidden = true;
      form.hidden = false;
      showStep(0);
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (sending) return;
      if (active < steps.length - 1) { advance(); return; }
      if (!steps.every((_, index) => validateStep(index))) return;
      statusText.textContent = '';
      setSending(true);
      const showSendError = () => showResult({error: 'לא התקבל אישור לשליחה. אפשר לנסות שוב מהמסך הנוכחי.'});
      if (configuration.submitUrl) {
        sendFromWebsite().then(showResult).catch(showSendError);
        return;
      }
      if (typeof google === 'undefined' || !google.script?.run) {
        showResult({error: 'גרסה מקומית להצגת הטופס. השליחה זמינה מהקישור של Apps Script.'});
        return;
      }
      google.script.run.withSuccessHandler(showResult)
        .withFailureHandler(showSendError)
        .submitZamirTrial(form);
    });
  </script>
</body>
</html>
